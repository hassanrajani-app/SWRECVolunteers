<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Southwest RE Centers | Volunteer Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">SW</span>
        <div class="brand-text">
          <h1>Southwest RE Centers</h1>
          <p>Volunteer Dashboard</p>
        </div>
      </div>
      <button id="refreshBtn" class="refresh-btn" title="Reload from Google Sheet">
        <span class="refresh-icon">⟳</span> Refresh
      </button>
    </div>
  </header>

  <main class="container">

    <section class="stats-grid" id="statsGrid">
      <div class="stat-card stat-navy">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 5 18.5V20"/><circle cx="9.5" cy="8.5" r="3.5"/><path d="M19.5 20v-1.3a3.2 3.2 0 0 0-2.2-3"/><path d="M15.2 5.2a3.2 3.2 0 0 1 0 6.1"/></svg>
        </div>
        <div class="stat-body">
          <p class="stat-label">Total Volunteers</p>
          <p class="stat-value" id="statTotal">—</p>
        </div>
      </div>

      <div class="stat-card stat-blue">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2.5"/><path d="M4 10h16"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M12 14.2v3.2"/><path d="M10.4 15.8h3.2"/></svg>
        </div>
        <div class="stat-body">
          <p class="stat-label">Average Age</p>
          <p class="stat-value" id="statAvgAge">—</p>
        </div>
      </div>

      <div class="stat-card stat-gender stat-card-wide">
        <div class="stat-card-wide-header">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 3.2"/></svg>
          </div>
          <p class="stat-label">Gender Split</p>
        </div>
        <div class="stat-breakdown" id="statGenderBreakdown"></div>
      </div>

      <div class="stat-card stat-brown stat-card-wide">
        <div class="stat-card-wide-header">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.3 2.3 3.6 5.3 3.6 8.5s-1.3 6.2-3.6 8.5c-2.3-2.3-3.6-5.3-3.6-8.5S9.7 5.8 12 3.5Z"/></svg>
          </div>
          <p class="stat-label">Country of Birth</p>
        </div>
        <div class="stat-breakdown" id="statCountryBreakdown"></div>
      </div>

      <div class="stat-card stat-navy stat-card-wide">
        <div class="stat-card-wide-header">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 3 8.5l9 4.5 9-4.5L12 4Z"/><path d="M7 10.8v4.4c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.4"/><path d="M20.5 8.5v5.5"/></svg>
          </div>
          <p class="stat-label">Education Level</p>
        </div>
        <div class="stat-breakdown" id="statEducationBreakdown"></div>
      </div>

      <div class="stat-card stat-blue stat-card-wide">
        <div class="stat-card-wide-header">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="11" rx="2"/><path d="M8.5 8V6.3A2.3 2.3 0 0 1 10.8 4h2.4A2.3 2.3 0 0 1 15.5 6.3V8"/><path d="M3.5 13h17"/></svg>
          </div>
          <p class="stat-label">Occupation</p>
        </div>
        <div class="stat-breakdown" id="statOccupationBreakdown"></div>
      </div>
    </section>

    <section class="toolbar">
      <input id="searchInput" type="text" placeholder="Search by name or email..." />

      <div class="multiselect" id="centerMS">
        <button type="button" class="ms-btn" id="centerMSBtn">RE Center<span class="ms-badge hidden" id="centerMSBadge">0</span><span class="chev">▾</span></button>
        <div class="ms-panel hidden" id="centerMSPanel"></div>
      </div>

      <div class="multiselect" id="positionMS">
        <button type="button" class="ms-btn" id="positionMSBtn">Position<span class="ms-badge hidden" id="positionMSBadge">0</span><span class="chev">▾</span></button>
        <div class="ms-panel hidden" id="positionMSPanel"></div>
      </div>

      <div class="multiselect" id="gradeMS">
        <button type="button" class="ms-btn" id="gradeMSBtn">Grade Level<span class="ms-badge hidden" id="gradeMSBadge">0</span><span class="chev">▾</span></button>
        <div class="ms-panel hidden" id="gradeMSPanel"></div>
      </div>

      <button id="clearFiltersBtn" class="ghost-btn">Clear filters</button>
      <button id="exportBtn" class="export-btn">⬇ Export to Excel</button>
    </section>

    <section class="table-meta">
      <span id="countLabel" class="count-label"></span>
      <label class="page-size">
        Rows per page
        <select id="pageSizeSelect">
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="250" selected>250</option>
          <option value="1000">1000</option>
        </select>
      </label>
    </section>

    <section id="stateMessage" class="state-message">Loading volunteers…</section>

    <div class="table-wrap">
      <table class="vol-table hidden" id="volTable">
        <thead>
          <tr>
            <th data-key="fullName">Name <span class="sort-ind"></span></th>
            <th data-key="center">RE Center <span class="sort-ind"></span></th>
            <th data-key="position">Position <span class="sort-ind"></span></th>
            <th data-key="gradeLevel">Grade Level <span class="sort-ind"></span></th>
            <th data-key="age">Age <span class="sort-ind"></span></th>
            <th data-key="gender">Gender <span class="sort-ind"></span></th>
            <th data-key="contact">Contact <span class="sort-ind"></span></th>
            <th data-key="email">Email <span class="sort-ind"></span></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>

  </main>

  <!-- Detail overlay -->
  <div id="detailOverlay" class="overlay hidden">
    <div class="detail-card">
      <button id="closeDetail" class="close-btn" aria-label="Close">✕</button>
      <div class="detail-header">
        <img id="detailPhoto" class="detail-photo" src="" alt="Headshot" />
        <div>
          <h2 id="detailName"></h2>
          <p id="detailPosition" class="detail-subtitle"></p>
          <p id="detailCenter" class="detail-subtitle"></p>
        </div>
      </div>
      <dl class="detail-grid" id="detailFields"></dl>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
